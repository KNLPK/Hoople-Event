<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Hoople — Experiences that connect communities</title>
    <meta
      name="description"
      content="Hoople is the all-in-one experience platform for communities in Indonesia. Discover events and activities, book a session, and check in with a QR e-ticket."
    />

    <!-- The project answers to three hostnames Vercel generates on its own.
         This one is the address the app is actually published at, so every
         share and every crawler is pointed back to it. -->
    <link rel="canonical" href="https://hoople-event.vercel.app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6D28FF" />
    <meta name="color-scheme" content="light" />

    <!-- Share card: pasting the link into WhatsApp or Slack should show what
         Hoople is, not a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hoople" />
    <meta property="og:url" content="https://hoople-event.vercel.app/" />
    <meta property="og:title" content="Hoople — Experiences that connect communities" />
    <meta
      property="og:description"
      content="Discover events and activities across Indonesia, book a seat, and check in with a QR e-ticket. Three surfaces: for people, for organizers, for teams."
    />
    <meta property="og:image" content="https://hoople-event.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hoople — experiences that connect communities" />
    <meta property="og:locale" content="en_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hoople — Experiences that connect communities" />
    <meta
      name="twitter:description"
      content="Discover events and activities across Indonesia, book a seat, and check in with a QR e-ticket."
    />
    <meta name="twitter:image" content="https://hoople-event.vercel.app/og.jpg" />

    <!-- Fonts load without blocking the first paint. A stylesheet on another
         host is render-blocking by default, so a slow or unreachable Google
         Fonts left the page blank until it timed out — on a phone on mobile
         data that is the whole first impression. Every family in tokens.css
         has a system fallback, and the URL already asks for display=swap, so
         the page paints immediately and the webfonts arrive when they do. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
